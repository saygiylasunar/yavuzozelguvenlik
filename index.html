<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f4f0e8" />
  <meta name="description" content="Yavuz Özel Güvenlik: Akşehir'de özel güvenlik eğitimi, güvenlik hizmetleri, sınav hazırlığı ve ÖGG bilgi merkezi." />
  <script>
    try {
      const storedTheme = localStorage.getItem('yavuz-theme') || 'auto'
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      const resolvedTheme = storedTheme === 'dark' || storedTheme === 'light'
        ? storedTheme
        : (prefersDark ? 'dark' : 'light')
      document.documentElement.dataset.theme = resolvedTheme
      document.documentElement.style.colorScheme = resolvedTheme
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', resolvedTheme === 'dark' ? '#07151d' : '#f4f0e8')
    } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Michroma&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-25..200" rel="stylesheet" />
  <title>Yavuz Özel Güvenlik | Akşehir</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
